name: Scheduled Permanent Shutdown

on:
  schedule:
    # Wednesday, October 14, 2026 at 21:00 AST (18:00 UTC)
    - cron: '0 18 14 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shutdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Replace index.html with Permanent Shutdown Tombstone
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ISE 291 Question Bank - Terminated</title>
            <style>
              body {
                background: #030712;
                color: #f9fafb;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
                text-align: center;
              }
              .box {
                max-width: 480px;
                background: #111827;
                border: 1px solid #374151;
                border-radius: 16px;
                padding: 40px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
              }
              h1 { color: #ef4444; font-size: 1.5rem; margin-bottom: 12px; }
              p { color: #9ca3af; line-height: 1.6; margin-bottom: 16px; font-size: 0.95rem; }
              .stamp { border-top: 1px solid #1f2937; padding-top: 16px; font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
            </style>
          </head>
          <body>
            <div class="box">
              <h1>Service Permanently Concluded</h1>
              <p>The ISE 291 Interactive Question Bank access period ended on <strong>Wednesday, October 14, 2026 at 9:00 PM AST</strong>.</p>
              <p>This service is now permanently shut down.</p>
              <div class="stamp">Archived • KFUPM ISE 291</div>
            </div>
          </body>
          </html>
          EOF
          
          # Remove question bank data files
          rm -f questions_data.js questions.json
          
      - name: Commit and Push Shutdown
        run: |
          git config user.name "0xZHRA"
          git config user.email "95636416+0xZHRA@users.noreply.github.com"
          git add index.html questions_data.js questions.json
          git commit -m "chore(lifecycle): permanently shut down question bank after expiration" || exit 0
          git push origin main
